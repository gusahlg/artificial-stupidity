[package]
name = "rust_fun"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
anyhow = "1.0"
rayon = "1.10"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
wide = "0.7"
env_logger = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
# Pin the newest upstream main revision audited on 2026-08-22. Keeping both
# crates on the same git source makes the transformer runtime reproducible and
# avoids silently building against whichever sibling checkout happens to be
# active on a host.
tensor-ash = { git = "https://github.com/gusahlg/tensor-ash.git", rev = "57bbf3884daf8e483650fdace37144021b17b93d" }
llama-ash = { git = "https://github.com/gusahlg/tensor-ash.git", rev = "57bbf3884daf8e483650fdace37144021b17b93d", package = "llama-ash" }

[profile.release]
opt-level = 3
lto = "thin"
